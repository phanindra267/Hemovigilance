<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LIFEFlow Blood Bank &amp; Hemovigilance System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/lifeflow.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include "navbar.html" %}
    <div class="main-wrapper">
        {% if user.is_authenticated %}
            {% include "sidebar.html" %}
        {% endif %}
        <main class="content-area">
            {% include "messages.html" %}
            {% block content %}{% endblock %}
        </main>
    </div>
    {% include "footer.html" %}
    <div id="sidebarOverlay" class="d-none" style="position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1019;"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/lifeflow.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
