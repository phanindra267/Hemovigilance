{% extends "base.html" %}
{% block title %}Internal Server Error (500) — LIFEFlow{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="card border-0 shadow-sm rounded-4 p-5 mx-auto" style="max-width:560px;background:white;">
        <div class="text-danger mb-3" style="font-size:4rem;"><i class="bi bi-exclamation-triangle-fill"></i></div>
        <h2 class="fw-800 text-dark mb-2">500 — System Exception</h2>
        <p class="text-muted mb-4">
            An unexpected error occurred while processing this operation. The incident has been noted in the audit trail.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'accounts:dashboard' %}" class="btn btn-lf-primary px-4">
                <i class="bi bi-arrow-clockwise me-1"></i> Back to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
