{% extends "base.html" %}
{% block title %}Page Not Found (404) — LIFEFlow{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="card border-0 shadow-sm rounded-4 p-5 mx-auto" style="max-width:560px;background:white;">
        <div class="text-danger mb-3" style="font-size:4rem;"><i class="bi bi-compass"></i></div>
        <h2 class="fw-800 text-dark mb-2">404 — Page Not Found</h2>
        <p class="text-muted mb-4">
            The requested blood bank resource or operational screen does not exist or has been relocated within the system.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{% if user.is_authenticated %}{% url 'accounts:dashboard' %}{% else %}{% url 'core:home' %}{% endif %}" class="btn btn-lf-primary px-4">
                <i class="bi bi-house-door-fill me-1"></i> Return to Safety
            </a>
        </div>
    </div>
</div>
{% endblock %}
