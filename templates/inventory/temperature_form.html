{% extends "base.html" %}
{% block title %}Log Temperature ? LIFEFlow{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm p-4 rounded-4">
                <h4 class="fw-bold text-danger mb-4"><i class="bi bi-thermometer-half me-2"></i>Record Storage Temperature</h4>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3"><label class="form-label">Storage Device *</label>{{ form.storage_device }}</div>
                    <div class="mb-3"><label class="form-label">Observed Temperature (?C) *</label>{{ form.temperature_celsius }}</div>
                    <div class="mb-4"><label class="form-label">Corrective Action Taken (if excursion detected)</label>{{ form.corrective_action_taken }}</div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'inventory:temperature_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-blood px-4">Submit Temperature Reading</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
